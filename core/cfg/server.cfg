// =====================================================================
// L4D2 coop server.cfg (L4D2-PLUGINS pack). Runs on every map change.
// Lines marked [EDIT] are yours to change.
//
// Keep this file ASCII only (English letters, digits, symbols). The engine
// treats every non-ASCII byte (Chinese etc.) as the end of a command, even
// inside quotes and comments, so Chinese text here breaks the settings.
// For a Chinese server name use addons/sourcemod/configs/hostname.txt.
// =====================================================================

// [Basic]
hostname "L4D2 Coop Server"          // [EDIT] server name (ASCII only; Chinese name goes in hostname.txt)
rcon_password ""                     // [EDIT] remote console password; empty = rcon disabled
sv_region 4                          // 4 = Asia
//sv_steamgroup "12345678"           // [EDIT] Steam group ID (optional)
//sv_steamgroup_exclusive 1

motdfile "mymotd.txt"                // message of the day: edit left4dead2/mymotd.txt
hostfile "myhost.txt"

// [Game mode]
sm_cvar mp_gamemode coop
//sm_cvar z_difficulty Normal        // force a difficulty (Easy/Normal/Hard/Impossible); resets player votes on every map
sv_allow_lobby_connect_only 0        // allow connecting by IP without a lobby

// [Players] needs l4dtoolz from the basic module
sm_cvar sv_maxplayers 8              // max human players (up to 32)
sm_cvar sv_force_unreserved 1        // drop the lobby reservation so players can connect directly
sm_cvar sv_visiblemaxplayers 8

// [Tickrate] needs tickrate_enabler from the basic module and -tickrate 100 on the command line.
// l4d2_tick_network_tweaks sets rate / updaterate / cmdrate from -tickrate; these are the extras.
sm_cvar fps_max 0
sm_cvar sv_maxunlag 0.35
sm_cvar net_splitpacket_maxrate 100000
sm_cvar tick_door_speed 1.3          // door speed fix at high tickrate (TickrateFixes)

// [File consistency] 0 = allow client-side mods
sv_pure 0
sv_consistency 0

// [Logging]
log on
sv_logbans 1
sv_logecho 0
sv_logfile 1
sv_log_onefile 0
