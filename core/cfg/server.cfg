// =====================================================================
// L4D2 战役服务器 server.cfg（L4D2-PLUGINS 插件包）
// 每次换图都会执行。带 [改] 的行请改成你自己的。
// =====================================================================

// [基本]
hostname "L4D2 战役服务器"                 // [改] 服务器名称
rcon_password "请改成你自己的密码"          // [改] 远程控制密码，留空则关闭 rcon
sv_region 4                                 // 服务器区域：4=亚洲
//sv_steamgroup "12345678"                  // [改] Steam 组 ID（可选）
//sv_steamgroup_exclusive 1

motdfile "mymotd.txt"                       // 公告文件，改 left4dead2/mymotd.txt，避免更新时被覆盖
hostfile "myhost.txt"

// [游戏模式]
sm_cvar mp_gamemode coop                    // 战役
//sm_cvar z_difficulty Normal               // 固定难度（Easy/Normal/Hard/Impossible）；打开后每次换图都会重置玩家投票的难度
sv_allow_lobby_connect_only 0               // 允许直接用 IP 连接（不必从大厅进）

// [人数] 需要 basic 模块的 l4dtoolz
sm_cvar sv_maxplayers 8                     // 最多几名真人玩家（最大 32）
sm_cvar sv_force_unreserved 1               // 去掉大厅预留，方便直接连接
sm_cvar sv_visiblemaxplayers 8

// [Tickrate] 需要 basic 模块的 tickrate_enabler，并在启动参数里加 -tickrate 100
// l4d2_tick_network_tweaks 会按 -tickrate 自动设置 rate、updaterate、cmdrate，这里只补充几项
sm_cvar fps_max 0
sm_cvar sv_maxunlag 0.35
sm_cvar net_splitpacket_maxrate 100000
sm_cvar tick_door_speed 1.3                 // 高 tick 下门开关速度修正（TickrateFixes）

// [文件一致性] 0 = 允许玩家使用客户端 MOD
sv_pure 0
sv_consistency 0

// [日志]
log on
sv_logbans 1
sv_logecho 0
sv_logfile 1
sv_log_onefile 0
