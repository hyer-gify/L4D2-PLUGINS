// [L4D2-PLUGINS] 基础模块参数（由 cfg/sourcemod/sourcemod.cfg 每次换图执行）
// 这里只放没有自带 cfg 文件的插件参数；有自带 cfg 的插件请改 cfg/sourcemod/<插件名>.cfg。

// 终局结束后自动换到下一张官方图（l4d2_next_map，作者 fdxx）没有参数。

// 地图投票（l4d2_map_vote，作者 fdxx）：管理员不受菜单队伍限制；战役模式不需要清分
sm_cvar l4d2_map_vote_adminteamflags 1
sm_cvar l4d2_map_vote_clearscores 0
