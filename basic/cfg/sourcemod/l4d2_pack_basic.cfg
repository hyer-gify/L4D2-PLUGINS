// [L4D2-PLUGINS] Basic module settings (run by cfg/sourcemod/sourcemod.cfg on every map change).
// Only plugins without their own cfg are set here; others use cfg/sourcemod/<plugin>.cfg.
// Keep engine cfg files ASCII only: non-ASCII bytes break commands.

// l4d2_next_map (by fdxx): moves to the next official campaign after a finale. No settings.

// l4d2_map_vote (by fdxx): admins are not limited by the menu team flags; coop needs no score reset.
sm_cvar l4d2_map_vote_adminteamflags 1
sm_cvar l4d2_map_vote_clearscores 0
