// [L4D2-PLUGINS] 多人生还者（l4dmultislots，作者 HarryPotter）常用参数。
// 文件里没写的参数使用插件默认值；完整说明见 basic/README 或原作者仓库。

// 服务器最多几名生还者（需要 l4dtoolz 的 sv_maxplayers 至少这么大）
l4d_multislots_max_survivors "8"

// 最少几名生还者（不足时用电脑补齐）
l4d_multislots_min_survivors "4"

// 第 5 名以后的生还者加入时给的武器：主武器随机 T1，副武器随机
l4d_multislots_firstweapon "18"
l4d_multislots_secondweapon "5"

// 安全屋内为第 5 名以后的玩家多刷急救包
l4d_multislots_saferoom_extra_first_aid "1"
l4d_multislots_finale_extra_first_aid "1"
