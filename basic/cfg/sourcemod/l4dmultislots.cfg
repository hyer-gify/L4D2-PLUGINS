// [L4D2-PLUGINS] l4dmultislots (by HarryPotter) common settings.
// Anything not listed uses the plugin default; see the author's repository for the full list.

// Max survivors (sv_maxplayers from l4dtoolz must be at least this high)
l4d_multislots_max_survivors "8"

// Min survivors (bots fill the gap)
l4d_multislots_min_survivors "4"

// Weapons for the 5th and later survivors: random T1 primary, random secondary
l4d_multislots_firstweapon "18"
l4d_multislots_secondweapon "5"

// Extra first aid kits in the saferoom for the 5th and later players
l4d_multislots_saferoom_extra_first_aid "1"
l4d_multislots_finale_extra_first_aid "1"
