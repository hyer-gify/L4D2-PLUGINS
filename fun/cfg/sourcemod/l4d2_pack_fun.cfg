// [L4D2-PLUGINS] Fun module settings (run by cfg/sourcemod/sourcemod.cfg on every map change).
// Incap crawl / railgun / turret / auto regen write their own cfg/sourcemod/l4d2_*.cfg on first start.
// Keep engine cfg files ASCII only: non-ASCII bytes break commands.

// l4d2_kill_si_restore_health (by fdxx): health restored per special infected kill
sm_cvar l4d2_kill_smoker_restore_health 2
sm_cvar l4d2_kill_boomer_restore_health 1
sm_cvar l4d2_kill_hunter_restore_health 3
sm_cvar l4d2_kill_spitter_restore_health 1
sm_cvar l4d2_kill_jockey_restore_health 3
sm_cvar l4d2_kill_charger_restore_health 3
sm_cvar l4d2_kill_witch_restore_health 10
sm_cvar l4d2_kill_tank_restore_health 20
sm_cvar l4d2_kill_si_restore_health_Limit 100
