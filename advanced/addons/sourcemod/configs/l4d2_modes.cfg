// L4D2 模式切换配置（l4d2_mode_switcher.smx 读取）
// 修改后可以用 sm_mode_reload 重新读取。
//
// modes 里每个模式：
//   name     菜单和投票里显示的名字
//   desc     菜单里的一行说明（可省略）
//   plugins  本模式需要加载的插件，路径相对 addons/sourcemod/plugins，用 ; 分隔，按顺序加载
//            切换到别的模式时，新模式不需要的插件会被卸载
//   cfg      插件加载完成后执行的 cfg（相对 left4dead2/cfg），每次换图也会重新执行
//   options  1 = 允许在本模式下用 !mode 调整下面 options 里的参数
//
// reset_cfg 在每次切换模式时、加载新插件之前执行。
// cfg 里请用 sm_mode_cvar 代替 sm_cvar：这样切回其他模式时，这些 cvar 会自动还原为切换前的值。
"Modes"
{
	"reset_cfg"	"l4d2_modes/_reset.cfg"

	"modes"
	{
		"normal"
		{
			"name"		"原版战役"
			"desc"		"不加载任何难度插件，官方导演系统"
			"plugins"	""
			"cfg"		"l4d2_modes/normal.cfg"
			"options"	"0"
		}

		"pills"
		{
			"name"		"药役（普通）"
			"desc"		"4 特 / 16 秒，只有药和小枪，AI 特感加强"
			"plugins"	"disabled/advanced/l4d2_si_spawn_control.smx;disabled/advanced/l4d2_item_rule.smx;disabled/advanced/AI_HardSI.smx"
			"cfg"		"l4d2_modes/pills.cfg"
			"options"	"1"
		}

		"pills_hard"
		{
			"name"		"药役（硬核）"
			"desc"		"6 特 / 10 秒，特感在最近的视野外刷新"
			"plugins"	"disabled/advanced/l4d2_si_spawn_control.smx;disabled/advanced/l4d2_item_rule.smx;disabled/advanced/AI_HardSI.smx"
			"cfg"		"l4d2_modes/pills_hard.cfg"
			"options"	"1"
		}

		"anne"
		{
			"name"		"Anne 风格药役"
			"desc"		"6 特 / 16 秒，AnneHappy 的 AI 特感 + 目标分配"
			"plugins"	"disabled/advanced/l4d2_si_spawn_control.smx;disabled/advanced/l4d2_item_rule.smx;disabled/anne/l4d_target_override.smx;disabled/anne/SI_Target_limit.smx;disabled/anne/ai_hunter_2.smx;disabled/anne/ai_jockey_2.smx;disabled/anne/ai_charger_2.smx;disabled/anne/ai_spitter_2.smx;disabled/anne/ai_boomer_2.smx;disabled/anne/ai_smoker_new.smx;disabled/anne/ai_tank_new.smx"
			"cfg"		"l4d2_modes/anne.cfg"
			"options"	"1"
		}
	}

	// 参数投票：组名 -> { 选项 -> 执行的服务器命令 }
	// 选中的参数在本模式内一直有效（换图会重放），切换模式后清空。
	"options"
	{
		"特感数量"
		{
			"2 特"		"sm_mode_cvar l4d2_si_spawn_control_max_specials 2"
			"3 特"		"sm_mode_cvar l4d2_si_spawn_control_max_specials 3"
			"4 特"		"sm_mode_cvar l4d2_si_spawn_control_max_specials 4"
			"5 特"		"sm_mode_cvar l4d2_si_spawn_control_max_specials 5"
			"6 特"		"sm_mode_cvar l4d2_si_spawn_control_max_specials 6"
			"8 特"		"sm_mode_cvar l4d2_si_spawn_control_max_specials 8"
			"10 特"		"sm_mode_cvar l4d2_si_spawn_control_max_specials 10"
			"12 特"		"sm_mode_cvar l4d2_si_spawn_control_max_specials 12"
		}
		"特感刷新时间"
		{
			"5 秒"		"sm_mode_cvar l4d2_si_spawn_control_spawn_time 5"
			"10 秒"		"sm_mode_cvar l4d2_si_spawn_control_spawn_time 10"
			"15 秒"		"sm_mode_cvar l4d2_si_spawn_control_spawn_time 15"
			"20 秒"		"sm_mode_cvar l4d2_si_spawn_control_spawn_time 20"
			"25 秒"		"sm_mode_cvar l4d2_si_spawn_control_spawn_time 25"
			"30 秒"		"sm_mode_cvar l4d2_si_spawn_control_spawn_time 30"
		}
		"刷新位置"
		{
			"普通（官方找位）"		"sm_mode_cvar l4d2_si_spawn_control_spawn_mode 0"
			"增强（找位失败时换 Nav）"	"sm_mode_cvar l4d2_si_spawn_control_spawn_mode 3"
			"贴脸（最近的视野外）"		"sm_mode_cvar l4d2_si_spawn_control_spawn_mode 1"
		}
		"一起复活"
		{
			"关闭"		"sm_mode_cvar l4d2_si_spawn_control_together_spawn 0"
			"开启（死完一波再刷）"	"sm_mode_cvar l4d2_si_spawn_control_together_spawn 1"
		}
	}
}
