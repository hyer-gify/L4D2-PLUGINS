// Anne-style pills mode: 6 SI every 16 s (same as the AnneHappy default respawn interval).
// AI plugins come from AnneHappy (fantasylidong/CompetitiveWithAnne); spawns use fdxx's
// l4d2_si_spawn_control instead of Anne's infected_control.
exec l4d2_modes/_pills_items.cfg

sm_mode_cvar l4d2_si_spawn_control_max_specials 6
sm_mode_cvar l4d2_si_spawn_control_spawn_time 16
sm_mode_cvar l4d2_si_spawn_control_first_spawn_time 8
sm_mode_cvar l4d2_si_spawn_control_kill_si_time 20
sm_mode_cvar l4d2_si_spawn_control_spawn_mode 3
sm_mode_cvar l4d2_si_spawn_control_spawn_range_normal 1200
sm_mode_cvar l4d2_si_spawn_control_together_spawn 1
sm_mode_cvar l4d2_si_spawn_control_hunter_limit 2
sm_mode_cvar l4d2_si_spawn_control_jockey_limit 2
sm_mode_cvar l4d2_si_spawn_control_smoker_limit 1
sm_mode_cvar l4d2_si_spawn_control_boomer_limit 1
sm_mode_cvar l4d2_si_spawn_control_spitter_limit 1
sm_mode_cvar l4d2_si_spawn_control_charger_limit 2

// AnneHappy common infected settings
sm_mode_cvar z_mob_spawn_min_size 15
sm_mode_cvar z_mob_spawn_max_size 15
sm_mode_cvar z_common_limit 30
