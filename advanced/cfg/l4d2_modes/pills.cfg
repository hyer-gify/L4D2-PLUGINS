// 药役（普通）：4 特 / 16 秒
exec l4d2_modes/_pills_items.cfg

// 特感控制（l4d2_si_spawn_control，作者 fdxx）
sm_mode_cvar l4d2_si_spawn_control_max_specials 4
sm_mode_cvar l4d2_si_spawn_control_spawn_time 16
sm_mode_cvar l4d2_si_spawn_control_first_spawn_time 10
sm_mode_cvar l4d2_si_spawn_control_kill_si_time 25
sm_mode_cvar l4d2_si_spawn_control_spawn_mode 3
sm_mode_cvar l4d2_si_spawn_control_spawn_range_normal 1500
sm_mode_cvar l4d2_si_spawn_control_together_spawn 0
sm_mode_cvar l4d2_si_spawn_control_hunter_limit 1
sm_mode_cvar l4d2_si_spawn_control_jockey_limit 1
sm_mode_cvar l4d2_si_spawn_control_smoker_limit 1
sm_mode_cvar l4d2_si_spawn_control_boomer_limit 1
sm_mode_cvar l4d2_si_spawn_control_spitter_limit 1
sm_mode_cvar l4d2_si_spawn_control_charger_limit 1

// 普通小僵尸尸潮规模
sm_mode_cvar z_common_limit 30
