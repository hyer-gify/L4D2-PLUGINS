// 每次切换模式时执行（加载新模式的插件之前）。
// 1) 清空 l4d2_item_rule 的物品规则（插件没加载时这些命令不存在，会提示 Unknown command，可以忽略）
sm_item_rule_reset start_item
sm_item_rule_reset item_replace
sm_item_rule_reset item_limit
sm_item_rule_reset item_spawn

// 2) AI 加强插件在代码里直接改过的官方 cvar，恢复为游戏默认值
sm_mode_resetcvar z_tank_throw_force z_tank_throw_interval tank_throw_min_interval
sm_mode_resetcvar boomer_exposed_time_tolerance boomer_vomit_delay z_vomit_range
sm_mode_resetcvar hunter_pounce_ready_range hunter_committed_attack_range hunter_pounce_max_loft_angle hunter_leap_away_give_up_range z_pounce_crouch_delay z_pounce_damage_interrupt
sm_mode_resetcvar z_jockey_leap_range tongue_break_from_damage_amount smoker_tongue_delay tongue_dropping_to_ground_time tank_throw_allow_range
